name: Deploy

on:
  push:
    branches: ["main"]

permissions: {}

# Deploys run one at a time, in push order: two syncs with --delete running
# together would let the older commit's sync remove what the newer one added.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to S3
    runs-on: ubuntu-latest
    # The AWS role trusts only this workflow on main, bound to this
    # environment, so the environment's branch policy and the role's trust
    # both gate publishing.
    environment: production
    permissions:
      contents: read
      # Mints the OIDC token exchanged for the publish role.
      id-token: write
    steps:
      - name: Information
        run: echo "Deploying datasets update"

      - name: Code checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.2

      - name: Compile datasets file
        run: bun install --frozen-lockfile && bun run compile

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::857808225976:role/gh-publish-surrealdb-datasets
          role-session-name: datasets-deploy-${{ github.run_id }}
          role-duration-seconds: 900

      # datasets.json and notebooks.json are built into out/, not public/, so
      # the sync leaves them alone and the copies below replace them in place.
      - name: Deploy to S3
        run: |
          aws s3 sync public s3://datasets.surrealdb.com --delete --exclude datasets.json --exclude notebooks.json --cache-control "public, max-age=1800"
          aws s3 cp out/datasets.json s3://datasets.surrealdb.com/datasets.json --cache-control "public, max-age=300"
          aws s3 cp out/notebooks.json s3://datasets.surrealdb.com/notebooks.json --cache-control "public, max-age=300"
